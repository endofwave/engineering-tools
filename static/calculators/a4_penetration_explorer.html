<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 — Concrete Penetration Explorer</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:#111a2e; --grid:#1e2c48; --ink:#dbe6f5;
    --dim:#7f93b5; --accent:#38bdf8; --accent2:#f5a742; --steel:#9fb4d4;
    --line:#2a3a5c; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:20px}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  h1{font-size:19px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .scene{background:#0d1526;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  label.sl{display:block;margin:0 0 12px}
  .slrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
  .slrow b{font-weight:600}
  .slval{color:var(--accent);font-size:13px}
  input[type=range]{width:100%;accent-color:var(--accent);margin-top:5px}
  .btn{width:100%;padding:9px;background:var(--accent);color:#04121f;border:none;
    border-radius:7px;font-weight:600;cursor:pointer;font-size:14px;margin-top:4px}
  .btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);margin-top:8px}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:6px}
  .ro{background:#0d1526;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  .ro .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .ro .v{font-size:16px;font-weight:600}
  .hero{font-size:26px;font-weight:700;color:var(--accent)}
  .check{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
  .check b{color:var(--ok)}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);padding:8px 14px;flex-wrap:wrap}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .note{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.55}
  .barwrap{height:10px;background:#0d1526;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
  .bar{height:100%}
  .state{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .scenerow{display:flex;flex-direction:column}
  .scenerow > svg{width:100%;height:auto;display:block}
  .fnpanel{padding:10px 14px 8px;border-top:1px solid var(--line);
    font-size:11px;line-height:1.42;background:#0c1424}
  .fnhdr{color:var(--dim);text-transform:uppercase;letter-spacing:.04em;font-size:10px;margin-bottom:6px}
  .fneq{color:var(--ink);font-size:12px;margin-bottom:8px}
  .fnzones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.fnzones{grid-template-columns:1fr}}
  .fnzone{border:1px solid var(--line);border-radius:6px;padding:7px 9px;transition:all .1s}
  .fnz{font-size:10.5px;color:var(--ink);margin-bottom:3px}
  .fnf{font-size:12px;color:var(--accent);margin-bottom:3px}
  .fdim{color:var(--dim);font-size:10px;line-height:1.5}
  .fnnow{margin-top:8px;font-size:10.5px;color:var(--dim)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useRef,useEffect} = React;

// ---------- PHYSICS (verified against Python model) ----------
const RHO_C = 2370, M = 0.906, D = 0.0269;   // fixed: shot-14 projectile & density
const NSAMP = 300;                            // resampled trajectory length

function noseOgive(psi){ return {Nstar: 1/(3*psi) - 1/(24*psi*psi), Hd: Math.sqrt(psi-0.25)}; }
function Scorr(fcMPa){ return 72.0/Math.sqrt(fcMPa); }   // Eq.54 simplified

function model(V0, psi, fcMPa){
  const fc = fcMPa*1e6;
  const {Nstar,Hd} = noseOgive(psi);
  const k = 0.707 + Hd;
  const S = Scorr(fcMPa);
  const I = M*V0*V0/(S*D*D*D*fc);
  const N = M/(Nstar*RHO_C*D*D*D);
  const Iconf = Math.PI*k/4;
  let Xd;
  if(I<=Iconf){ Xd = Math.sqrt(4*k*I/Math.PI*(1+k*Math.PI/(4*N))/(1+I/N)); }
  else { Xd = (2/Math.PI)*N*Math.log((1+I/N)/(1+k*Math.PI/(4*N))) + k; }
  return {Nstar,Hd,k,S,I,N,fc,Xd_closed:Xd};
}

// ODE integration in x — the animation IS the solver.
// Returns FIXED-SIZE resampled trajectory + Fmax + impact energy.
function integrate(V0, psi, fcMPa){
  const m = model(V0,psi,fcMPa);
  const {Nstar,k,S,fc} = m;
  const A = Math.PI*D*D/4, kd = k*D, coef = Math.PI*k*D*D*D/4;
  const V1sq = (M*V0*V0 - coef*S*fc)/(M + coef*Nstar*RHO_C);
  const c = V1sq>0 ? (Math.PI*D/(4*k))*(S*fc + Nstar*RHO_C*V1sq)
                   : M*V0*V0/(kd*kd);
  const dx = 2e-5;
  let x=0, V=V0, Fmax=0, guard=0;
  const raw=[{x:0,V:V0,F:0}];
  while(V>0 && guard<600000){
    const F = (x<kd) ? c*x : A*(S*fc + Nstar*RHO_C*V*V);
    if(F>Fmax) Fmax=F;
    V += -F/(M*V)*dx; x += dx;
    raw.push({x, V:Math.max(V,0), F});
    guard++; if(x>5) break;
  }
  // resample raw -> NSAMP points, uniform in index
  const samples = new Array(NSAMP);
  for(let i=0;i<NSAMP;i++){
    const j = Math.round(i*(raw.length-1)/(NSAMP-1));
    samples[i] = raw[j];
  }
  const Ek0 = 0.5*M*V0*V0, staticF = A*S*fc;
  return {...m, kd, X:x, Xd_ode:x/D, samples, Fmax, Ek0, c, A, staticF};
}

// ---------- SCENE ----------
function Scene({res, prog}){
  const W=620, H=560, surfaceY=90, padBot=22;       // wide layout: full card width now that panel sits below
  const usableH = H - surfaceY - padBot;
  const maxDepth = Math.max(res.Xd_ode*1.08, 3);
  const ppu = usableH / maxDepth;                     // px per (x/d)
  const kU = res.k;
  const yAt = (xd)=> surfaceY + xd*ppu;
  const cx = W/2, dpx = 26, craterHalfTop = dpx*2.4;
  const bodyLen = dpx*2.4;

  const tipXd = res.Xd_ode*prog;                      // current tip depth (x/d)
  const craterY = yAt(kU);
  const crater = `${cx-craterHalfTop},${surfaceY} ${cx+craterHalfTop},${surfaceY} ${cx+dpx/2},${craterY} ${cx-dpx/2},${craterY}`;

  const tipY   = yAt(tipXd);
  const noseTop= tipY - dpx*1.3;
  const bodyTop= noseTop - bodyLen;

  const gridlines=[];
  for(let g=1; g<=Math.floor(maxDepth); g++){
    const y=yAt(g);
    gridlines.push(<g key={g}>
      <line x1="30" y1={y} x2={W-8} y2={y} stroke="var(--grid)" strokeWidth="1" strokeDasharray="2 4"/>
      <text x="34" y={y-3} fill="var(--dim)" fontSize="9" className="mono">{g}</text>
    </g>);
  }

  return (
  <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}}>
    <defs>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stopColor="#6b83ad"/><stop offset=".5" stopColor="#cdd9ee"/><stop offset="1" stopColor="#5c7099"/>
      </linearGradient>
      <pattern id="agg" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="14" height="14" fill="#131d33"/>
        <circle cx="4" cy="5" r="1.4" fill="#1c2942"/><circle cx="10" cy="10" r="1.1" fill="#1c2942"/>
        <circle cx="11" cy="3" r="0.9" fill="#1c2942"/>
      </pattern>
    </defs>

    <rect x="30" y="0" width={W-38} height={surfaceY} fill="#0d1526"/>
    <rect x="30" y={surfaceY} width={W-38} height={usableH+padBot} fill="url(#agg)" stroke="var(--line)"/>
    <line x1="30" y1={surfaceY} x2={W-8} y2={surfaceY} stroke="var(--steel)" strokeWidth="1.5"/>
    <text x={W-12} y={surfaceY-6} fill="var(--dim)" fontSize="9" textAnchor="end" className="mono">surface</text>
    {gridlines}

    <polygon points={crater} fill="#182642" stroke="var(--accent)" strokeWidth="1" strokeDasharray="3 3" opacity="0.85"/>
    <line x1={cx+craterHalfTop} y1={craterY} x2={W-40} y2={craterY} stroke="var(--accent)" strokeWidth="1" strokeDasharray="4 3" opacity="0.6"/>
    <text x={W-42} y={craterY-4} fill="var(--accent)" fontSize="9.5" textAnchor="end" className="mono">x = k·d</text>
    <text x="36" y={surfaceY+16} fill="var(--accent)" fontSize="10" className="mono">ZONE 1 · crater</text>
    <text x="36" y={surfaceY+28} fill="var(--dim)" fontSize="9" className="mono">F = c·x</text>

    <rect x={cx-dpx/2} y={craterY} width={dpx} height={Math.max(0,yAt(res.Xd_ode)-craterY)} fill="#101c33" stroke="var(--line)"/>
    <text x="36" y={craterY+16} fill="var(--accent2)" fontSize="10" className="mono">ZONE 2 · tunnel</text>
    <text x="36" y={craterY+28} fill="var(--dim)" fontSize="9" className="mono">F = S·fc + N*·pc·V²</text>

    <line x1="30" y1={yAt(res.Xd_ode)} x2={W-8} y2={yAt(res.Xd_ode)} stroke="var(--ok)" strokeWidth="1.4"/>
    <text x={W-12} y={yAt(res.Xd_ode)+14} fill="var(--ok)" fontSize="11" textAnchor="end" className="mono">X/d = {res.Xd_ode.toFixed(2)}</text>

    <g>
      <path d={`M ${cx-dpx/2} ${bodyTop}
                L ${cx+dpx/2} ${bodyTop}
                L ${cx+dpx/2} ${noseTop}
                Q ${cx+dpx/2} ${tipY} ${cx} ${tipY}
                Q ${cx-dpx/2} ${tipY} ${cx-dpx/2} ${noseTop} Z`}
            fill="url(#steel)" stroke="#25324a" strokeWidth="1"/>
    </g>
  </svg>);
}

// ---------- LIVE READOUT ----------
function LiveBars({res, prog, firing}){
  const idx = Math.min(res.samples.length-1, Math.max(0, Math.floor(prog*(res.samples.length-1))));
  const s = res.samples[idx];
  const Ek = 0.5*M*s.V*s.V;
  const label = prog<=0 ? "at impact" : (prog>=0.999 ? "at rest" : "in flight");
  return (
  <div style={{marginTop:12}}>
    <div className="state mono">{label}</div>
    <div className="slrow"><b>Resistive force</b><span className="slval mono">{(s.F/1000).toFixed(0)} kN</span></div>
    <div className="barwrap"><div className="bar" style={{width:`${res.Fmax?100*s.F/res.Fmax:0}%`,background:'var(--accent2)'}}/></div>
    <div className="slrow" style={{marginTop:10}}><b>Kinetic energy</b><span className="slval mono">{(Ek/1000).toFixed(1)} kJ</span></div>
    <div className="barwrap"><div className="bar" style={{width:`${res.Ek0?100*Ek/res.Ek0:0}%`,background:'var(--accent)'}}/></div>
    <div className="slrow" style={{marginTop:10}}><b>Velocity</b><span className="slval mono">{s.V.toFixed(0)} m/s</span></div>
    <div className="barwrap"><div className="bar" style={{width:`${100*s.V/res.samples[0].V}%`,background:'var(--steel)'}}/></div>
  </div>);
}

// ---------- COMPUTED-FUNCTIONS PANEL (left of scene) ----------
function FnPanel({res, prog}){
  const idx = Math.min(res.samples.length-1, Math.max(0, Math.floor(prog*(res.samples.length-1))));
  const s = res.samples[idx];
  const xd = s.x/D;
  const inCrater = s.x < res.kd;
  const Sfc = res.S*res.fc/1e6;              // MPa, static term
  const dynCoef = res.Nstar*RHO_C;           // kg/m³, multiplies V²
  const dynNow = dynCoef*s.V*s.V/1e6;        // MPa, dynamic term at current V
  const hi = {borderColor:'var(--accent)', background:'#132540'};
  return (
    <div className="fnpanel mono">
      <div className="fnhdr">solver · what is integrated</div>
      <div className="fneq">M·V·dV/dx = −F(x,V)</div>

      <div className="fnzones">
        <div className="fnzone" style={inCrater?hi:null}>
          <div className="fnz">zone 1 · crater&nbsp;&nbsp;<span className="fdim">x ≤ k·d = {(res.kd*1000).toFixed(0)} mm</span></div>
          <div className="fnf">F = c·x</div>
          <div className="fdim">c = {(res.c/1e6).toFixed(2)} MN/m — force grows linearly with depth as the projectile shoulders the cone open.</div>
        </div>

        <div className="fnzone" style={!inCrater?hi:null}>
          <div className="fnz">zone 2 · tunnel&nbsp;&nbsp;<span className="fdim">x &gt; k·d</span></div>
          <div className="fnf">F = A·(S·fc + N*·pc·V²)</div>
          <div className="fdim">A = {(res.A*1e6).toFixed(0)} mm² · S·fc = {Sfc.toFixed(0)} MPa (static) · N*·pc = {dynCoef.toFixed(0)} kg/m³ → {dynNow.toFixed(1)} MPa @V (dynamic)</div>
        </div>
      </div>

      <div className="fnnow">now · <b style={{color:'var(--accent)'}}>{inCrater?'crater':'tunnel'}</b> · x/d={xd.toFixed(2)} · V={s.V.toFixed(0)} m/s · F={(s.F/1000).toFixed(0)} kN</div>
    </div>
  );
}

function App(){
  const [V0,setV0]=useState(277);
  const [psi,setPsi]=useState(2.0);
  const [fc,setFc]=useState(35.2);
  const [prog,setProg]=useState(0);        // 0 = poised at surface (impact state visible)
  const [firing,setFiring]=useState(false);
  const raf=useRef(null);

  const res = useMemo(()=>integrate(V0,psi,fc),[V0,psi,fc]);

  const fire = ()=>{
    cancelAnimationFrame(raf.current);
    setFiring(true);
    const dur=4500, t0=performance.now();               // slow enough to watch the readouts
    const step=(t)=>{
      const p=Math.min(1,(t-t0)/dur);
      setProg(p);
      if(p<1){ raf.current=requestAnimationFrame(step); }
      else { setFiring(false); }
    };
    raf.current=requestAnimationFrame(step);
  };
  const scrubTo=(p)=>{ cancelAnimationFrame(raf.current); setFiring(false);
                       setProg(Math.max(0,Math.min(1,p))); };
  const stepBy=(d)=>scrubTo(prog+d);
  const reset=()=>{ cancelAnimationFrame(raf.current); setFiring(false);
                    setV0(277);setPsi(2.0);setFc(35.2);setProg(0); };
  useEffect(()=>{ cancelAnimationFrame(raf.current); setFiring(false); setProg(0); },[V0,psi,fc]);
  useEffect(()=>()=>cancelAnimationFrame(raf.current),[]);

  const err = Math.abs(res.Xd_ode-res.Xd_closed)/res.Xd_closed*100;

  return (
  <div className="wrap">
    <h1>Concrete penetration — two-zone explorer</h1>
    <div className="sub">Rigid ogive projectile into a semi-infinite concrete target. The rest position is found by
      integrating the equation of motion in the browser — the animation is a solver, not a drawing.</div>

    <div className="grid">
      <div className="scene">
        <div className="scenerow">
          <FnPanel res={res} prog={prog}/>
          <Scene res={res} prog={prog}/>
        </div>
        <div className="legend">
          <span><span className="sw" style={{background:'var(--accent)'}}></span>crater · F = c·x</span>
          <span><span className="sw" style={{background:'var(--accent2)'}}></span>tunnel · F = S·fc + N*·pc·V²</span>
          <span><span className="sw" style={{background:'var(--ok)'}}></span>final depth X</span>
        </div>
      </div>

      <div>
        <div className="card">
          <label className="sl">
            <div className="slrow"><b>Impact velocity V0</b><span className="slval mono">{V0} m/s</span></div>
            <input type="range" min="120" max="1000" step="1" value={V0} onChange={e=>setV0(+e.target.value)}/>
          </label>
          <label className="sl">
            <div className="slrow"><b>Nose sharpness psi (CRH)</b><span className="slval mono">{psi.toFixed(2)}</span></div>
            <input type="range" min="1" max="4.5" step="0.05" value={psi} onChange={e=>setPsi(+e.target.value)}/>
          </label>
          <label className="sl" style={{marginBottom:4}}>
            <div className="slrow"><b>Concrete strength fc</b><span className="slval mono">{fc.toFixed(1)} MPa</span></div>
            <input type="range" min="20" max="100" step="0.5" value={fc} onChange={e=>setFc(+e.target.value)}/>
          </label>
          <button className="btn" onClick={fire}>▸ Fire (slow)</button>
          <button className="btn ghost" onClick={reset}>reset to shot 14</button>
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid var(--line)'}}>
            <div className="slrow"><b>Scrub descent</b><span className="slval mono">{(prog*100).toFixed(0)}%</span></div>
            <input type="range" min="0" max="1" step="0.004" value={prog} onChange={e=>scrubTo(+e.target.value)}/>
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button className="btn ghost" style={{marginTop:0,flex:1}} onClick={()=>stepBy(-0.02)}>◂ step</button>
              <button className="btn ghost" style={{marginTop:0,flex:1}} onClick={()=>stepBy(0.02)}>step ▸</button>
            </div>
          </div>
        </div>

        <div className="card" style={{marginTop:12}}>
          <div className="ro" style={{marginBottom:8}}>
            <div className="k">penetration depth</div>
            <div className="hero mono">X/d = {res.Xd_ode.toFixed(2)}</div>
          </div>
          <div className="readout">
            <div className="ro"><div className="k">impact fn I</div><div className="v mono">{res.I.toFixed(2)}</div></div>
            <div className="ro"><div className="k">geometry fn N</div><div className="v mono">{res.N.toFixed(0)}</div></div>
            <div className="ro"><div className="k">nose factor N*</div><div className="v mono">{res.Nstar.toFixed(3)}</div></div>
            <div className="ro"><div className="k">crater k</div><div className="v mono">{res.k.toFixed(2)}</div></div>
          </div>
          <LiveBars res={res} prog={prog} firing={firing}/>
          <div className="check">
            Truth check — ODE stop vs closed form Eq.(15b): <b>{res.Xd_ode.toFixed(3)} vs {res.Xd_closed.toFixed(3)}</b> ({err.toFixed(2)}%).<br/>
            I/N = {(res.I/res.N).toFixed(3)} — {res.I/res.N<0.15? "much less than 1: geometry barely moves the result (deep regime).":"geometry contributes."}
          </div>
        </div>
      </div>
    </div>
    <div className="note">
      Fixed at shot-14 values: M = 0.906 kg, d = 26.9 mm, pc = 2370 kg/m³. S follows fc via the paper's
      simplified correlation S = 72·fc^(-1/2) (Eq. 54). At the shot-14 preset the model gives X/d ~ 6.2
      (paper's tabulated S = 12 gives 6.21). Move one slider at a time to feel the three monotonic dependences
      that dimensional analysis predicts but cannot prove. Validity: rigid projectile (V0 below ~800 m/s for
      hardened steel), normal incidence, semi-infinite unreinforced target.
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
